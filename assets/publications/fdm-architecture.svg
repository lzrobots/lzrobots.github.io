<g class="visual-tokens"><rect x="52" y="378" width="28" height="28" rx="5"/><rect x="92" y="378" width="28" height="28" rx="5"/><rect x="132" y="378" width="28" height="28" rx="5"/></g>
<g class="language-tokens"><rect x="224" y="378" width="28" height="28" rx="5"/><rect x="264" y="378" width="28" height="28" rx="5"/></g>
<g class="noised-tokens"><rect x="436" y="378" width="28" height="28" rx="5"/><rect x="476" y="378" width="28" height="28" rx="5"/><rect x="516" y="378" width="28" height="28" rx="5"/></g>
<text class="node-detail" x="106" y="432">Input visual</text>
