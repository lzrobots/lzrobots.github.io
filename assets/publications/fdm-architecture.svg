<rect class="loss-node" x="886" y="98" width="76" height="38" rx="8"/>
<text class="loss-label" x="924" y="124">ℒ<tspan baseline-shift="sub" font-size="14">future</tspan></text>
<g class="diagram-edge backprop-edge"><path class="edge-track" d="M850 117H880"/><path class="flow-pulse" d="M850 117H880"/></g>
<g class="diagram-edge backprop-edge"><path class="edge-track" d="M1002 117H968"/><path class="flow-pulse" d="M1002 117H968"/></g>
<g class="diagram-edge"><path class="edge-track" d="M788 190V164"/><path class="flow-pulse" d="M788 190V164"/></g>
</g>
<g class="action-tokens"><rect x="436" y="103" width="28" height="28" rx="5"/><rect x="476" y="103" width="28" height="28" rx="5"/><rect x="516" y="103" width="28" height="28" rx="5"/></g>
<text class="node-detail" x="490" y="154">Clean action</text>
