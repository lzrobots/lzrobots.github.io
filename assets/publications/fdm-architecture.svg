<rect class="node-context" x="34" y="190" width="300" height="144" rx="14"/>
<rect class="node-action" x="346" y="190" width="308" height="144" rx="14"/>
<text class="node-label" x="184" y="230">Context expert</text>
<text class="node-label" x="500" y="230">Action expert</text>
