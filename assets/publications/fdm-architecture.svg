<rect class="injection-band" x="612" y="258" width="148" height="48" rx="7"/>
<text class="injection-label" x="686" y="278">Action features<tspan x="686" dy="19">injection</tspan></text>
<g class="diagram-edge injection-edge"><path class="edge-track" d="M660 230H712"/><path class="flow-pulse" d="M660 230H712"/></g>
